[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --basetemp keeps pytest's tmp_path dirs OUT of %LOCALAPPDATA%\Temp. The Phase 15
# disk-cleanup tests (tests/test_phase15_cleanup.py) exercise scan()/safe_clean() over
# %LOCALAPPDATA%\Temp — the same base pytest uses for tmp_path by default. That collision
# corrupts pytest's temp base mid-run, cascading FileNotFoundError into every later
# tmp_path-based test. The basetemp must also stay OUTSIDE the jarvis repo, because the
# repo root is a never-touch path for the cleanup code — a repo-local basetemp would make
# the deletion tests fail (deletion correctly refused). A sibling dir satisfies both:
# outside %LOCALAPPDATA%\Temp AND outside the repo. Resolves relative to the repo cwd.
addopts = -v --tb=short --basetemp=../.jarvis-pytest-tmp
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
